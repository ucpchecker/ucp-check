# Publishes to npm with provenance when a GitHub release is published.
# Needs npm "trusted publishing" enabled for ucp-check → this repo/workflow
# (npmjs.com → package → Settings → Publishing access). No token to rotate.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
