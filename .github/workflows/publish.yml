# Publishes ucp-check and its alias ucpchecker to npm with provenance when a
# GitHub release is published. Both packages have this workflow registered as
# their npm trusted publisher (npmjs.com → package → Settings), so there is no
# token to rotate. Bump both package.json versions before tagging a release.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
      - run: npm publish --provenance --access public
        working-directory: alias/ucpchecker
